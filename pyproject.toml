[project]
name = "llm-bench"
version = "0.1.0"
description = "Benchmark TTFT, tokens/sec and latency of a local LLM over an OpenAI-compatible streaming API"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "typer>=0.12",
    "rich>=13.7",
]

[project.scripts]
llm-bench = "llm_bench.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
